[project]
name = "sistema-casa-espirita"
version = "0.1.0"
description = "Sistema interno de cadastro para casa espírita"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pedro Augusto Xavier" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"
# migrations são geradas automaticamente pelo Alembic
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042 (enums viram StrEnum) e UP046 (genérico no estilo PEP 695) mudam
# comportamento sutil -- o str() dos enums e os genéricos do Pydantic. Não
# é falha nem segurança; fica pra uma mudança própria, com teste.
ignore = ["UP042", "UP046"]
