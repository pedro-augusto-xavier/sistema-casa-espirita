name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: casa_espirita
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/casa_espirita
      # Valores de mentira, só pra passar das travas de "chave fraca em
      # produção" -- o banco do CI é descartável e não tem dado real.
      SECRET_KEY: ci-secret-sem-valor-real-mas-com-32-chars-ou-mais
      CHAVES_CRIPTOGRAFIA: "1:Y2ktY2hhdmUtZGUtdGVzdGUtc2VtLXZhbG9yLXJlYWw="
      CHAVE_HMAC: Y2ktaG1hYy1kZS10ZXN0ZS1zZW0tdmFsb3ItcmVhbC0x
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Dependências com falha conhecida (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Análise estática de segurança (bandit)
        run: bandit -r app scripts -ll -q

      # banco vazio do CI: grava dados no formato antigo, cifra, decifra de
      # volta e cifra de novo, conferindo valor por valor
      - name: Migrations vão e voltam sem perder dado
        run: python -m tests.verificar_migracoes
        env:
          CONFIRMO_BANCO_DESCARTAVEL: "1"

      - name: Migrations
        run: alembic upgrade head

      - name: Migrations sem diferença pros modelos
        run: alembic check

      - name: Seed (listas de referência)
        run: python -m scripts.seed

      - name: Testes (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Dependências com falha conhecida (npm audit)
        run: npm audit --audit-level=high

      - name: Lint (oxlint)
        run: npm run lint

      - name: Testes (vitest)
        run: npm run test

      - name: Build
        run: npm run build
