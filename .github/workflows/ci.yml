name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: casa_espirita
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/casa_espirita
      # Valores de mentira, só pra passar das travas de "chave fraca em
      # produção" -- o banco do CI é descartável e não tem dado real.
      SECRET_KEY: ci-secret-sem-valor-real-mas-com-32-chars-ou-mais
      CHAVES_CRIPTOGRAFIA: "1:Y2ktY2hhdmUtZGUtdGVzdGUtc2VtLXZhbG9yLXJlYWw="
      CHAVE_HMAC: Y2ktaG1hYy1kZS10ZXN0ZS1zZW0tdmFsb3ItcmVhbC0x
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Dependências com falha conhecida (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Análise estática de segurança (bandit)
        run: bandit -r app scripts -ll -q

      # banco vazio do CI: grava dados no formato antigo, cifra, decifra de
      # volta e cifra de novo, conferindo valor por valor
      - name: Migrations vão e voltam sem perder dado
        run: python -m tests.verificar_migracoes
        env:
          CONFIRMO_BANCO_DESCARTAVEL: "1"

      - name: Migrations
        run: alembic upgrade head

      - name: Migrations sem diferença pros modelos
        run: alembic check

      - name: Seed (listas de referência)
        run: python -m scripts.seed

      - name: Testes (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Dependências com falha conhecida (npm audit)
        run: npm audit --audit-level=high

      - name: Lint (oxlint)
        run: npm run lint

      - name: Testes (vitest)
        run: npm run test

      - name: Build
        run: npm run build

  # Ponta a ponta: API + front de verdade num navegador, contra um banco
  # descartável. Pega o que os testes de cada lado sozinhos não pegam.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: casa_espirita
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/casa_espirita
      SECRET_KEY: ci-secret-sem-valor-real-mas-com-32-chars-ou-mais
      CHAVES_CRIPTOGRAFIA: "1:Y2ktY2hhdmUtZGUtdGVzdGUtc2VtLXZhbG9yLXJlYWw="
      CHAVE_HMAC: Y2ktaG1hYy1kZS10ZXN0ZS1zZW0tdmFsb3ItcmVhbC0x
      APP_ENV: ci
      E2E_SENHA: senha-do-e2e-so-no-banco-descartavel

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          npm ci --prefix frontend
          npx --prefix frontend playwright install --with-deps chromium

      - name: Banco (migrations, seed, usuário de teste)
        run: |
          alembic upgrade head
          python -m scripts.seed
          python -m tests.e2e_preparar

      - name: Teste de ponta a ponta (Playwright)
        working-directory: frontend
        run: npx playwright test

      - name: Rastro da falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: frontend/test-results
          retention-days: 7

  # Produção: migrations + seed com a URL do dono do banco e, depois, o
  # deploy da API no Render pelo deploy hook (auto-deploy desligado lá).
  # A URL do dono só existe aqui, no Environment "producao" (aprovação
  # obrigatória, só a main) -- nunca no Render. Ver DEPLOY.md.
  # O log deste repositório é público: nada de `set -x` nem de imprimir
  # variáveis; os segredos vão por `env:` de cada passo, nunca no script.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [testes, frontend, e2e]
    runs-on: ubuntu-latest
    environment: producao
    concurrency:
      group: producao
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Migrations e seed (banco de produção)
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DONO_DATABASE_URL }}
          CHAVES_CRIPTOGRAFIA: ${{ secrets.CHAVES_CRIPTOGRAFIA }}
          CHAVE_HMAC: ${{ secrets.CHAVE_HMAC }}
        run: |
          # O GitHub só esconde o segredo inteiro; esconde também a senha e
          # cada chave sozinhas, caso algum erro mostre só um pedaço.
          python - <<'EOF'
          import os
          from urllib.parse import urlsplit
          partes = [urlsplit(os.environ["DATABASE_URL"]).password or ""]
          partes += [p.partition(":")[2].strip() for p in os.environ["CHAVES_CRIPTOGRAFIA"].split(",")]
          partes.append(os.environ["CHAVE_HMAC"].strip())
          for parte in filter(None, partes):
              print(f"::add-mask::{parte}")
          EOF
          # Migration não assina token: uma SECRET_KEY descartável basta pra
          # passar da trava de produção, e a de verdade fica só no Render.
          SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          export SECRET_KEY
          alembic upgrade head
          python -m scripts.seed

      - name: Deploy da API no Render (este commit)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # Run de commit antigo aprovado depois de um mais novo não pode
          # publicar o código antigo por cima: quem publica é o run da ponta.
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "A main já avançou; o run do commit mais novo faz o deploy."
            exit 0
          fi
          curl -fsS -X POST -o /dev/null "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
